name: Android Test & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jvm-and-lint:
    name: Kotlin Compile, Robolectric Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env for Secrets Plugin
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Compile Debug Kotlin & Tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
          else
            gradle :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
          fi

      - name: Run Android Lint
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:lintDebug --no-daemon
          else
            gradle :app:lintDebug --no-daemon
          fi

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tralo-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  firestore-rules:
    name: Firestore Security Rules Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI & Rule Test Deps
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase

      - name: Run Firestore Rules Tests on Emulator
        run: firebase emulators:exec --only firestore --project demo-tralo "node --test firestore.test.js"
