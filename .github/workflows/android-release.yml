name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "${ODPT_API_KEY}" ]; then
            printf '\nODPT_API_KEY=%s\n' "${ODPT_API_KEY}" >> .env
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_B64}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_B64}" | base64 --decode > app/google-services.json
          fi
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

      - name: Build Signed Release APK & AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          else
            gradle :app:assembleRelease :app:bundleRelease --no-daemon
          fi

      - name: Build Unsigned Release Check (When Keystore Secret Not Configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is not configured; compiling release Kotlin and resources."
          if [ -x ./gradlew ]; then
            ./gradlew :app:compileReleaseKotlin --no-daemon
          else
            gradle :app:compileReleaseKotlin --no-daemon
          fi

      - name: Upload Release Artifacts
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tralo-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
